services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    volumes:
      - mute-data:/app/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  mute-data:
